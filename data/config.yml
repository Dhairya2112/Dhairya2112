# Everything you would normally want to edit lives here.
# Layout, colours and type scale live in src/tokens.py.

user: Dhairya2112            # GitHub login (also the profile repo name)
timezone: Asia/Kolkata       # used for "synced" and signal timestamps
tz_label: IST

hero:
  name: Dhairya Dave
  status: open to internships & engineering roles  # line next to the amber dot
  role: Software & AI Systems Engineer              # amber line under the name
  pitch:
    - "Architecting resilient backends and local-first agentic systems."
    - "Building Setu (voice OS agent) and SignalScope (dual-brain forensics)."
    - "Specialized in async Python, distributed pipelines, and PyTorch."
  strip_title: core engineering stack
  strip:
    - {label: "ai & agents",    value: "LangGraph • PyTorch"}
    - {label: "async backend",  value: "Django 6 • FastAPI"}
    - {label: "cloud & data",   value: "Postgres • AWS EC2"}

portrait:
  file: source/portrait.png   # cut-out PNG (transparent background); a plain JPG also works
  style: ascii                # ascii | particles
  ascii:
    font_size: 6              # smaller = more detail, tinier text
    ramp: " .:-=+*#%@"        # dark to bright
    gamma: 0.8                # <1 brightens midtones
  zoom: 2.5                   # 1 = whole photo, 2 = half the width (closer on the face)
  focus_x: 0.57               # slide the crop window: 0 = left edge, 1 = right edge
  focus_y: 0.253              # 0 = top, 1 = bottom
  fade_from: 0.80             # fade the lower part of the crop so the face leads (remove to disable)
  equalize: 0.5               # 0..1, spreads mid-tones so skin, hair and glasses separate
  detail: 0.8                 # local contrast boost, 0 = off
  floor: 0.16                 # minimum density for dark parts of you (hair, black shirt)
  vignette: false             # radial fade; only useful for JPGs with a busy backdrop
  invert: false               # flip the shading if your face reads inverted
  points: 1200                # particles style only
  mode: auto                  # JPG only: auto | subject | luminance

telemetry:
  weeks: 12
  languages:
    top: 5
    exclude: ["Jupyter Notebook"]   # notebook outputs inflate byte counts
  sprint:                           # optional DSA counter, edit by hand
    enabled: false
    label: dsa sprint
    solved: 0
    total: 150

