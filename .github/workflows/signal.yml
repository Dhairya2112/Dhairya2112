name: signal

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: profile-render
  cancel-in-progress: false

jobs:
  signal:
    # Only issues created from the signal form (its title starts with "signal").
    if: startsWith(github.event.issue.title, 'signal')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Issue text is untrusted: it only ever reaches the script through env vars.
      - name: Validate and record
        id: sig
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_USER_TYPE: ${{ github.event.issue.user.type }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: python -m src.signal_update

      - name: Commit signals.json
        if: steps.sig.outputs.status == 'accepted'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals.json
          git commit -m "signal #${ISSUE_NUMBER} from ${ISSUE_USER}"
          git pull --rebase -q
          git push -q

      - name: Redraw board
        if: steps.sig.outputs.status == 'accepted'
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
        run: python -m src.build

      - name: Publish to assets branch
        if: steps.sig.outputs.status == 'accepted'
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: bash src/publish.sh

      - name: Reply and close
        if: ${{ always() && steps.sig.outputs.status != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number }}
          STATUS: ${{ steps.sig.outputs.status }}
          REASON: ${{ steps.sig.outputs.reason }}
        run: |
          if [ "$STATUS" = "accepted" ]; then
            gh issue comment "$NUM" --body "Received. The board redraws in about a minute."
            gh issue close "$NUM" --reason completed
          else
            gh issue comment "$NUM" --body "Not posted. $REASON"
            gh issue close "$NUM" --reason "not planned"
          fi
